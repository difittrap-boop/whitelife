<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRGOVINA - White Life Roleplay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:#050505; color:white; min-height:100vh; }
        body::before { content:''; position:fixed; inset:0; background: linear-gradient(rgba(0,123,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,123,255,.05) 1px, transparent 1px); background-size:70px 70px; pointer-events:none; z-index: -1; }

        /* Navigacija */
        nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 999; background: #050505; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav { max-width:1400px; margin:auto; padding:20px 40px; display:flex; justify-content:space-between; align-items:center; }
        .menu { display:flex; gap:35px; }
        .menu a { text-decoration:none; color:white; font-weight:500; transition:.3s; }
        .menu a:hover, .menu a.active { color:#007bff; }
        
        /* Wrapper */
        .wrapper { max-width: 1200px; margin: 150px auto 60px; padding: 0 20px; }
        h1 { font-size: 52px; text-align: center; margin-bottom: 60px; font-weight: 900; }
        h1 span { color: #007bff; }
        
        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: #0c0c0c; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 30px; text-align: center; transition: 0.4s; position: relative; overflow: hidden; }
        .product-card:hover { border-color: #007bff; transform: translateY(-12px); box-shadow: 0 10px 30px rgba(0,123,255,0.15); }
        
        .img-container { width: 100%; height: 220px; background: #111; border-radius: 16px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; border: 1px dashed #333; overflow: hidden; }
        .img-container img { max-width: 100%; max-height: 100%; object-fit: cover; }
        
        .product-card h3 { font-size: 24px; margin-bottom: 15px; font-weight: 700; }
        .price { font-size: 28px; font-weight: 900; color: #007bff; margin: 20px 0; }
        
        .buy-btn { display: block; background: #007bff; color: white; padding: 18px; border-radius: 14px; text-decoration: none; font-weight: 800; font-size: 16px; transition: 0.3s; }
        .buy-btn:hover { background: #0056b3; transform: scale(1.02); }
    </style>
</head>
<body>

<nav>
    <div class="nav">
        <a href="index"><img src="logo.png" alt="Logo" style="height: 40px;"></a>
        <div class="menu">
			<a href="trgovina" style="color:#007bff;"><i class="fas fa-shopping-cart"></i> TRGOVINA</a>
            <a href="pravila" <i class="fas fa-file-alt"></i> PRAVILA</a>
            <a href="faq"><i class="fas fa-question-circle"></i> FAQ</a>
        </div>
        <div class="nav-right">
            <a href="#"><i class="fab fa-discord"></i></a>
        </div>
    </div>
</nav>

<div class="wrapper">
    <h1>White Life <span>Premium Shop</span></h1>
    
    <div class="shop-grid">
        <!-- CUSTOM MAFIJA -->
        <div class="product-card">
            <div class="img-container">
                <p style="color:#444;">SLIKA MAFIJE</p>
            </div>
            <h3>Custom Mafija</h3>
            <div class="price">15€</div>
            <a href="#" class="buy-btn">KUPI ODMAH</a>
        </div>
        
        <!-- CUSTOM AUTO 1X -->
        <div class="product-card">
            <div class="img-container">
                <p style="color:#444;">SLIKA AUTA</p>
            </div>
            <h3>Custom Auto 1x</h3>
            <div class="price">10€</div>
            <a href="#" class="buy-btn">KUPI ODMAH</a>
        </div>
        
        <!-- CUSTOM AUTO 3X -->
        <div class="product-card">
            <div class="img-container">
                <p style="color:#444;">SLIKA AUTA</p>
            </div>
            <h3>Custom Auto 3x</h3>
            <div class="price">10€</div>
            <a href="#" class="buy-btn">KUPI ODMAH</a>
        </div>
        
        <!-- CUSTOM AUTO 5X -->
        <div class="product-card">
            <div class="img-container">
                <p style="color:#444;">SLIKA AUTA</p>
            </div>
            <h3>Custom Auto 5x</h3>
            <div class="price">10€</div>
            <a href="#" class="buy-btn">KUPI ODMAH</a>
        </div>
    </div>
</div>

</body>
</html>
